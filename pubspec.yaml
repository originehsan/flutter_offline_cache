name: flutter_offline_cache
description: Offline-first stale-while-revalidate caching for Flutter with TTL management, background revalidation, and offline fallback.
version: 0.1.1
homepage: https://github.com/originehsan/flutter_offline_cache

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.2.0
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  rxdart: ^0.28.0
  mutex: ^3.1.0
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  test: ^1.25.0
  http_mock_adapter: ^0.6.1